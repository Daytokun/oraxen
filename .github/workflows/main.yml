name: Compilar Oraxen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Compilar con Gradle
        run: ./gradlew build --no-daemon

      - name: Guardar archivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: oraxen-plugin
          path: build/libs/*.jar
